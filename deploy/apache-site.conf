# =============================================================================
# Apache alternative to nginx.  Use one or the other, not both.
#   sudo a2enmod ssl proxy proxy_http headers rewrite expires
#
# Like the nginx file, Apache now serves the website itself from disk and only
# passes /api/ and /portal/ to Python.  If Python stops, the public website
# keeps working and only signing in and room booking are affected.
#
# Replace maths.iitkgp.ac.in, the two certificate paths and SITE_ROOT with
# whatever CIC gives you.
# =============================================================================
<VirtualHost *:80>
    ServerName maths.iitkgp.ac.in
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName maths.iitkgp.ac.in
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/maths.iitkgp.ac.in.crt
    SSLCertificateKeyFile /etc/ssl/private/maths.iitkgp.ac.in.key

    # ---- SITE_ROOT: the folder holding index.html, style.css, gallery/ -----
    DocumentRoot /srv/mathsite
    <Directory /srv/mathsite>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource disabled
    </Directory>

    LimitRequestBody 62914560

    # The same rule book the Python side sends. Keep the two in step: if you
    # change CSP in backend/server.py, change it here too.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'"

    # ---- never serve anything private --------------------------------------
    RedirectMatch 404 ^/(backend|deploy|JSON-files|docs)/
    RedirectMatch 404 /\.
    RedirectMatch 404 \.(db|py|service|conf|md)$

    # ---- the two things Python must handle ---------------------------------
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        /api/    http://127.0.0.1:8000/api/
    ProxyPassReverse /api/    http://127.0.0.1:8000/api/
    ProxyPass        /portal/ http://127.0.0.1:8000/portal/
    ProxyPassReverse /portal/ http://127.0.0.1:8000/portal/

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css              "access plus 30 days"
        ExpiresByType application/javascript "access plus 30 days"
        ExpiresByType image/jpeg            "access plus 30 days"
        ExpiresByType image/png             "access plus 30 days"
        ExpiresByType image/svg+xml         "access plus 30 days"
        ExpiresByType text/html             "access plus 0 seconds"
    </IfModule>

    ErrorDocument 404 /404.html
    ErrorDocument 502 /portal-down.html
    ErrorDocument 503 /portal-down.html
    ErrorDocument 504 /portal-down.html
</VirtualHost>
