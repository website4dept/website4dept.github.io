# Apache alternative to nginx (enable modules once: a2enmod ssl proxy proxy_http headers rewrite).
# Replace maths.iitkgp.ac.in and the certificate paths with CIC's real ones.
<VirtualHost *:80>
    ServerName maths.iitkgp.ac.in
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName maths.iitkgp.ac.in
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/maths.iitkgp.ac.in.crt
    SSLCertificateKeyFile /etc/ssl/private/maths.iitkgp.ac.in.key

    LimitRequestBody 62914560
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
</VirtualHost>
