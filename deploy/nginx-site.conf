# nginx: https in front of the portal (which also serves the website pages).
# Put in /etc/nginx/sites-available/mathsite, link it into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
# Replace maths.iitkgp.ac.in and the certificate paths with CIC's real ones.
server {
    listen 80;
    server_name maths.iitkgp.ac.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name maths.iitkgp.ac.in;

    ssl_certificate     /etc/ssl/certs/maths.iitkgp.ac.in.crt;
    ssl_certificate_key /etc/ssl/private/maths.iitkgp.ac.in.key;

    client_max_body_size 60m;          # photo / notice-file / backup-restore uploads

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
