# =============================================================================
# nginx for the Department of Mathematics site
#
# WHAT CHANGED AND WHY
# nginx used to hand every single request to the Python portal, so if Python
# stopped, the whole website went down with it.  Now nginx serves the website
# itself - the pages, the stylesheet, the photos - straight from disk, and only
# passes on the two things that really need Python:
#
#     /api/      the portal and booking API
#     /portal/   the staff portal pages
#
# So if Python is ever down, the public website keeps working; only logging in
# and booking a room stop.  It is also a good deal faster, because nginx is
# very good at sending files.
#
# WHERE TO PUT THIS FILE
#   sudo cp nginx-site.conf /etc/nginx/sites-available/mathsite
#   sudo ln -s /etc/nginx/sites-available/mathsite /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# BEFORE YOU DO: change maths.iitkgp.ac.in, the two certificate paths, and
# SITE_ROOT below to whatever CIC gives you.
# =============================================================================

server {
    listen 80;
    server_name maths.iitkgp.ac.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name maths.iitkgp.ac.in;

    ssl_certificate     /etc/ssl/certs/maths.iitkgp.ac.in.crt;
    ssl_certificate_key /etc/ssl/private/maths.iitkgp.ac.in.key;

    # ---- SITE_ROOT: the folder holding index.html, style.css, gallery/ ------
    root /srv/mathsite;
    index index.html;

    client_max_body_size 60m;          # photo / notice-file / backup-restore uploads

    # The same rule book the Python side sends. Keep the two in step: if you
    # change CSP in backend/server.py, change it here too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'" always;

    # ---- the two things Python must handle ---------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /portal/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Photos uploaded through the portal are written into SITE_ROOT/uploads,
    # so the ordinary static rules below already serve them. Nothing to add.

    # ---- nothing else reaches Python ---------------------------------------
    # Never serve the database, the configuration or anything else private.
    location ~ ^/(backend|deploy|JSON-files|docs)/ { return 404; }
    location ~ /\.                                 { return 404; }
    location ~ \.(db|py|service|conf|md)$          { return 404; }

    # Versioned assets (style.css?v=32) may be cached hard; pages may not,
    # or an edited page would keep showing the old text.
    location ~* \.(css|js|png|jpe?g|svg|webp|woff2?|mp4)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /404.html;
    }

    error_page 404 /404.html;

    # If Python is down, say so on the portal rather than showing nginx's own
    # error page. The website itself is unaffected.
    error_page 502 503 504 /portal-down.html;
    location = /portal-down.html { internal; }
}
